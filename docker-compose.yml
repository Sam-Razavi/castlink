# Local development services only. Azure App Service / managed Postgres /
# Azure Cache for Redis are the deployment targets — this file is never
# used in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-castlink}
      POSTGRES_USER: ${POSTGRES_USER:-castlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-castlink_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - castlink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castlink} -d ${POSTGRES_DB:-castlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - castlink-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  castlink-postgres-data:
  castlink-redis-data:
